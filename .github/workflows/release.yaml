name: Release Please
permissions:
  contents: write
  pull-requests: write
on:
  push:
    branches:
      - main
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An App token rather than GITHUB_TOKEN: pull requests opened with
      # GITHUB_TOKEN don't trigger workflows, so the release PR would never
      # get its checks run.
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: version.json

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      LEFTHOOK: "0"
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Build the worker bundle
        run: bun run build

      - name: Package the bundle
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf "out/nslookup-${TAG}.tar.gz" -C dist .

      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: out/*.tar.gz

      # release-please creates the release as a draft; uploading the assets
      # here publishes it.
      - name: Upload assets and publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: out/*
          fail_on_unmatched_files: true
