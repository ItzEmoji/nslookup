<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API · nslookup</title>
<meta name="color-scheme" content="light dark">
<script>
  try {
    const a = JSON.parse(localStorage.getItem("lookup_settings") || "{}").appearance;
    if (a === "light" || a === "dark") document.documentElement.dataset.theme = a;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400..700&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f38020'/%3E%3Cg fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='6'/%3E%3Cpath d='M19.5 19.5L15.5 15.5'/%3E%3C/g%3E%3C/svg%3E">
<!-- inline:shared.css -->
<style>
.side-item .badge-method{height:18px;padding:0 5px;font-size:11px}
.side-item .side-text.mono{font-size:12.5px}
.side-group+div .side-group:first-child{margin-top:20px}
.topsearch input{border-radius:19px}
.page-desc code,.ep .card-desc code,.param-desc code,.resp-desc code{color:var(--text);background:var(--surface-3);padding:1px 5px;border-radius:4px}
.page-desc p+p{margin-top:8px}
.spec-link{display:flex;align-items:center;gap:8px}
.ep{scroll-margin-top:calc(var(--topbar-h) + 16px)}
.ep-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ep-title code{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.ep-title .ep-summary{color:var(--text-2);font-size:13.5px;font-weight:500}
.ep-group{margin-top:32px;color:var(--text-3);font-size:12px;font-weight:600}
.ep-group+.ep{margin-top:10px}
.param{display:grid;grid-template-columns:220px minmax(0,1fr);gap:8px 24px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.param-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.param-name label,.param-name strong{font-size:13px;font-weight:600;font-family:var(--font-mono)}
.param-name span{color:var(--text-3);font-size:12px}
.param-desc{grid-column:2;color:var(--text-2);font-size:12.5px}
.param .input{max-width:440px}
.request{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface-2)}
.request .code{flex:1;min-width:0;background:var(--surface)}
.responses{border-top:1px solid var(--border)}
.responses summary{display:flex;align-items:center;gap:6px;padding:10px 16px;color:var(--link);font-size:13px;font-weight:500;cursor:pointer;list-style:none}
.responses summary::-webkit-details-marker{display:none}
.responses summary .icon{width:14px;height:14px;transition:transform 140ms var(--ease-out)}
.responses[open] summary .icon{transform:rotate(90deg)}
.resp{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px;padding:10px 16px;border-top:1px solid var(--border)}
.resp-desc{font-size:13px}
.resp-type{color:var(--text-3);font-size:12px}
.resp pre{grid-column:2;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.result{border-top:1px solid var(--border)}
.result-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);color:var(--text-2);font-size:13px}
.result pre{max-height:420px;overflow:auto;padding:12px 16px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.result:not(.hidden){animation:fade 200ms ease-out}
.load-note{padding:24px 0;color:var(--text-2)}
.spinner{width:12px;height:12px;border:2px solid var(--border-strong);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@media(max-width:900px){.brand span{display:none}.topsearch{flex:1}.param{grid-template-columns:minmax(0,1fr)}.param-desc{grid-column:1}.request{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4M8.5 12h7M8.5 16h7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
</svg>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar" onclick="toggleSidebar()"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <a class="brand" href="/">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#f38020"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="5.5"/><path d="M19 19l-3.8-3.8"/></g></svg>
    <span>nslookup</span>
  </a>
  <span class="topbar-sep" aria-hidden="true"></span>
  <form class="topsearch" role="search" action="/" method="get">
    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    <input name="domain" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Look up a domain or IP address" placeholder="Domain or IP address">
  </form>
  <div class="topbar-actions">
    <button class="icon-btn theme-btn" onclick="toggleTheme()" title="Switch light / dark" aria-label="Switch between light and dark theme">
      <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
      <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Endpoints">
    <div class="side-group">
      <a class="side-item" href="/"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span class="side-text">Back to lookup</span></a>
    </div>
    <div id="sideOps"></div>
    <div class="side-foot">
      <a class="side-item" href="/openapi.json"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg><span class="side-text mono">openapi.json</span></a>
    </div>
  </nav>
  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

  <main class="main">
    <div class="page page-narrow">
      <div class="page-head">
        <div>
          <h1 id="apiTitle">API</h1>
          <div class="page-desc" id="apiDesc"></div>
        </div>
        <a class="btn spec-link" href="/openapi.json"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>openapi.json</a>
      </div>
      <div id="ops"><p class="load-note">Loading <code>/openapi.json</code>…</p></div>
    </div>
  </main>
</div>

<script>
// The page is drawn from /openapi.json, so it can't drift from the API.
const BASE_URL = '{{ORIGIN}}';
let spec = null;

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
// Spec descriptions use `code` spans; everything else is plain text.
function prose(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}
function icon(name) {
  return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
}
function deref(obj) {
  if (!obj || !obj.$ref) return obj;
  return obj.$ref
    .replace(/^#\//, "")
    .split("/")
    .reduce((o, k) => (o ? o[k] : undefined), spec);
}

function opsInOrder() {
  const out = [];
  for (const [path, item] of Object.entries(spec.paths)) {
    for (const [method, op] of Object.entries(item)) {
      out.push({ path, method: method.toUpperCase(), op, params: (op.parameters || []).map(deref) });
    }
  }
  return out;
}

// One form control per parameter, chosen from its schema.
function control(op, p) {
  const id = op.operationId + "-" + p.name;
  const s = p.schema || {};
  const attrs = ' id="' + id + '" data-op="' + op.operationId + '" data-param="' + esc(p.name) + '" data-in="' + p.in + '"';
  if (p.name === "preview" || s.type === "boolean") {
    const on = p.name === "preview" ? false : s.default !== false;
    return '<label class="toggle-switch"><input type="checkbox"' + attrs + (on ? " checked" : "") + ' data-default="' + on + '"><span class="toggle-slider"></span></label>';
  }
  if (s.enum) {
    return '<select class="input"' + attrs + ">" + s.enum.map((v) => '<option value="' + esc(v) + '"' + (v === s.default ? " selected" : "") + ">" + esc(v) + "</option>").join("") + "</select>";
  }
  const value = p.in === "path" ? p.example || "" : "";
  const hint = p.in === "path" ? "" : p.example || "";
  return '<input class="input mono"' + attrs + ' value="' + esc(value) + '" placeholder="' + esc(hint) + '" autocomplete="off" spellcheck="false">';
}

function renderOp({ path, method, op, params }) {
  const id = op.operationId;
  const ok = op.responses?.["200"]?.content || {};
  const accept = Object.keys(ok)[0] || "application/json";
  const rows = params
    .map(
      (p) =>
        '<div class="param"><div class="param-name"><label for="' + id + "-" + esc(p.name) + '">' + esc(p.name) + "</label><span>" + esc(p.in) + (p.required ? " · required" : "") + "</span></div>" +
        control(op, p) +
        (p.description ? '<div class="param-desc">' + prose(p.description) + "</div>" : "") +
        "</div>",
    )
    .join("");
  const responses = Object.entries(op.responses || {})
    .map(([code, r]) => {
      const types = Object.entries(r.content || {});
      const example = types.find(([, c]) => c.example !== undefined);
      const shown = example ? (typeof example[1].example === "string" ? example[1].example : JSON.stringify(example[1].example, null, 2)) : "";
      return (
        '<div class="resp"><span class="badge ' + (code < 300 ? "badge-ok" : code < 500 ? "badge-warn" : "badge-fail") + '">' + esc(code) + '</span><div><div class="resp-desc">' + prose(r.description) + '</div><div class="resp-type mono">' + types.map(([t]) => esc(t)).join(", ") + "</div></div>" +
        (shown ? "<pre>" + esc(shown) + "</pre>" : "") +
        "</div>"
      );
    })
    .join("");
  return (
    '<section class="card ep" id="' + id + '" aria-labelledby="' + id + '-title" data-path="' + esc(path) + '" data-accept="' + esc(accept) + '">' +
    '<div class="card-head"><div><div class="ep-title" id="' + id + '-title"><span class="badge badge-method">' + method + "</span><code>" + esc(path) + '</code><span class="ep-summary">' + esc(op.summary || "") + "</span></div>" +
    (op.description ? '<p class="card-desc">' + prose(op.description) + "</p>" : "") +
    "</div></div>" +
    rows +
    '<div class="request"><div class="code"><span class="prompt">$</span><code id="curl-' + id + '"></code><button class="copy-btn" data-copy="' + id + '" aria-label="Copy command">' + icon("copy") + "</button></div>" +
    '<button class="btn btn-primary" data-send="' + id + '">' + icon("play") + "Send request</button></div>" +
    '<div class="result hidden" id="res-' + id + '" aria-live="polite"></div>' +
    (responses ? '<details class="responses"><summary>' + icon("chevron") + "Responses</summary>" + responses + "</details>" : "") +
    "</section>"
  );
}

function urlFor(id) {
  const card = document.getElementById(id);
  let path = card.dataset.path;
  const query = [];
  for (const el of card.querySelectorAll("[data-param]")) {
    const name = el.dataset.param;
    if (el.dataset.in === "path") {
      path = path.replace("{" + name + "}", el.value.trim() || "{" + name + "}");
    } else if (el.type === "checkbox") {
      if (name === "preview") {
        if (el.checked) query.push("preview");
      } else if (String(el.checked) !== el.dataset.default) query.push(name + "=" + el.checked);
    } else if (el.tagName === "SELECT") {
      if (el.selectedIndex !== [...el.options].findIndex((o) => o.defaultSelected)) query.push(name + "=" + el.value);
    } else if (el.value.trim()) {
      query.push(name + "=" + el.value.trim());
    }
  }
  return BASE_URL + path + (query.length ? "?" + query.join("&") : "");
}

function updateCurl(id) {
  document.getElementById("curl-" + id).textContent = 'curl "' + urlFor(id) + '"';
}

async function copyCurl(id, btn) {
  try {
    await navigator.clipboard.writeText(document.getElementById("curl-" + id).textContent);
    if (!btn.dataset.idle) btn.dataset.idle = btn.innerHTML;
    btn.innerHTML = icon("check");
    btn.classList.add("copied");
    clearTimeout(btn._t);
    btn._t = setTimeout(() => {
      btn.innerHTML = btn.dataset.idle;
      btn.classList.remove("copied");
    }, 1500);
  } catch (e) {}
}

function showResult(el, head, body) {
  el.innerHTML = '<div class="result-head">' + head + "</div>" + (body === undefined ? "" : "<pre>" + esc(body) + "</pre>");
  el.classList.remove("hidden");
}

async function send(id) {
  const card = document.getElementById(id);
  const out = document.getElementById("res-" + id);
  const url = urlFor(id);
  if (/\{[a-z]+\}/.test(url)) {
    showResult(out, '<span class="badge badge-warn">Missing value</span>', "Fill in the path parameters first.");
    return;
  }
  showResult(out, '<span class="spinner" aria-hidden="true"></span>Sending…');
  const started = performance.now();
  try {
    const res = await fetch(url, { headers: { accept: card.dataset.accept } });
    let body = await res.text();
    try {
      body = JSON.stringify(JSON.parse(body), null, 2);
    } catch (e) {}
    const kind = res.status < 300 ? "badge-ok" : res.status < 500 ? "badge-warn" : "badge-fail";
    showResult(
      out,
      '<span class="badge ' + kind + '">' + res.status + "</span><span class=\"mono\">" + Math.round(performance.now() - started) + " ms</span>",
      body,
    );
  } catch (e) {
    showResult(out, '<span class="badge badge-fail">Failed</span>', e.message);
  }
}

function render() {
  document.getElementById("apiTitle").textContent = (spec.info.title || "API") + " API";
  document.getElementById("apiDesc").innerHTML = (spec.info.description || "")
    .split(/\n\s*\n/)
    .map((para) => "<p>" + prose(para.replace(/\n/g, " ")) + "</p>")
    .join("");
  const ops = opsInOrder();
  const tags = (spec.tags || []).map((t) => t.name);
  for (const o of ops) for (const t of o.op.tags || ["Other"]) if (!tags.includes(t)) tags.push(t);
  const inTag = (t) => ops.filter((o) => (o.op.tags || ["Other"])[0] === t);
  const tagDesc = (t) => (spec.tags || []).find((x) => x.name === t)?.description || "";
  document.getElementById("ops").innerHTML = tags
    .filter((t) => inTag(t).length)
    .map((t) => '<h2 class="ep-group" title="' + esc(tagDesc(t)) + '">' + esc(t) + "</h2>" + inTag(t).map(renderOp).join(""))
    .join("");
  document.getElementById("sideOps").innerHTML = tags
    .filter((t) => inTag(t).length)
    .map(
      (t) =>
        '<div class="side-group"><div class="side-label">' + esc(t) + "</div>" +
        inTag(t)
          .map((o) => '<a class="side-item" href="#' + o.op.operationId + '"><span class="badge badge-method">' + o.method + '</span><span class="side-text mono">' + esc(o.path) + "</span></a>")
          .join("") +
        "</div>",
    )
    .join("");
  for (const o of ops) updateCurl(o.op.operationId);
  observeSections();
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

document.addEventListener("input", (e) => {
  const op = e.target.dataset?.op;
  if (op) updateCurl(op);
});
document.addEventListener("change", (e) => {
  const op = e.target.dataset?.op;
  if (op) updateCurl(op);
});
document.addEventListener("click", (e) => {
  const copy = e.target.closest("[data-copy]");
  if (copy) copyCurl(copy.dataset.copy, copy);
  const sendBtn = e.target.closest("[data-send]");
  if (sendBtn) send(sendBtn.dataset.send);
  if (e.target.closest(".sidebar a")) toggleSidebar(false);
});

function toggleSidebar(force) {
  const s = document.getElementById("sidebar");
  const open = force === undefined ? !s.classList.contains("open") : force;
  s.classList.toggle("open", open);
  document.getElementById("scrim").classList.toggle("show", open);
  document.getElementById("menuBtn").setAttribute("aria-expanded", String(open));
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  const apply = () => {
    root.dataset.theme = next;
  };
  if (document.startViewTransition) document.startViewTransition(apply);
  else apply();
  try {
    const s = JSON.parse(localStorage.getItem("lookup_settings") || "{}");
    s.appearance = next;
    localStorage.setItem("lookup_settings", JSON.stringify(s));
  } catch (e) {}
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") toggleSidebar(false);
  if ((e.ctrlKey || e.metaKey) && e.key === "k") {
    e.preventDefault();
    document.querySelector(".topsearch input").focus();
  }
});

// Highlight the endpoint in view in the sidebar.
function observeSections() {
  const links = document.querySelectorAll('.sidebar a[href^="#"]');
  const observer = new IntersectionObserver(
    (entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        for (const a of links) a.classList.toggle("active", a.getAttribute("href") === "#" + entry.target.id);
      }
    },
    { rootMargin: "-20% 0px -70% 0px" },
  );
  document.querySelectorAll(".ep").forEach((card) => observer.observe(card));
}

fetch("/openapi.json", { headers: { accept: "application/json" } })
  .then((r) => r.json())
  .then((json) => {
    spec = json;
    render();
  })
  .catch((e) => {
    document.getElementById("ops").innerHTML =
      '<p class="load-note"><span class="badge badge-fail">Failed</span> Couldn\'t load <a href="/openapi.json">/openapi.json</a>: ' + esc(e.message) + "</p>";
  });
</script>
</body>
</html>
